4V:
  w: Mobilization — releases stored matter to whatever surface asks for it, at the moment it is asked for.
  x: Reserve — holds web-ready derivatives of what organs have admitted for publication, identical to their admission, across time.
  z: Insulation — fails closed; buffers the organism from external drain and refuses anything no source feed admitted.
  y: Signal — tells the organism what it holds and where, so every surface can orient to the reserve without searching it.
6E:
  wx: what was deposited can be released without being remade.
  wz: release is bounded; under abuse the fat throttles and never bills.
  wy: released matter is addressable, so a surface can ask for exactly what it needs.
  xz: only admitted matter is stored; a withdrawn admission empties its deposit.
  xy: the reserve grows as organs deposit, and its manifest grows with it.
  zy: refusal is visible; the signal says what is held, never what is private.
4F:
  wxz: a safe, silent store that releases on request but cannot say what it holds.
  wxy: a growing, announced store with no membrane; any drain empties it.
  wzy: guarded, announced release with nothing kept; every request would go back to the source.
  xzy: a guarded, announced store that never releases; a museum vault.
1T: A subcutaneous reserve beneath the skin that holds every organ's admitted matter, releases it to the skin on demand, insulates the organism from external drain, and signals what it holds; one fat for the whole body.
